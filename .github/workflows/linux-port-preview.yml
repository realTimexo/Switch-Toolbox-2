name: Cross-platform client preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'LinuxPort/**'
      - '.github/workflows/linux-port-preview.yml'
  pull_request:
    paths:
      - 'LinuxPort/**'
      - '.github/workflows/linux-port-preview.yml'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-windows-client:
    name: Build Avalonia client on Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build cross-platform client
        run: dotnet build LinuxPort/SwitchToolbox.CrossPlatform.csproj --configuration Release

  package-linux-x64:
    name: Build Linux x86_64 preview packages
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install desktop runtime dependencies for packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1
      - name: Build AppImage and tar.gz (preview only)
        run: bash LinuxPort/package-linux-x64.sh
      - name: Verify package architecture and contents
        run: |
          file LinuxPort/dist/SwitchToolbox2-Linux-x86_64.AppImage
          file LinuxPort/dist/SwitchToolbox2-Linux-x86_64.tar.gz
          tar -tzf LinuxPort/dist/SwitchToolbox2-Linux-x86_64.tar.gz > /tmp/linux-tar-contents.txt
          sed -n '1,30p' /tmp/linux-tar-contents.txt
      - name: Upload non-release preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwitchToolbox2-Linux-x86_64-preview
          path: |
            LinuxPort/dist/SwitchToolbox2-Linux-x86_64.AppImage
            LinuxPort/dist/SwitchToolbox2-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
