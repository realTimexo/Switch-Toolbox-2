name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore Toolbox.sln
      - name: Build Release
        run: msbuild Toolbox.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false
      - name: Bundle VC runtime for Tegra swizzle
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          $redistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          $runtimeFiles = Get-ChildItem -Path $redistRoot -Filter vcruntime140.dll -File -Recurse -ErrorAction SilentlyContinue
          $output = Join-Path $PWD 'Toolbox/bin/Release'
          foreach ($arch in @('x64', 'x86')) {
            $runtime = $runtimeFiles | Where-Object { $_.FullName -match "\\$arch\\Microsoft\.VC\d+\.CRT\\vcruntime140\.dll$" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (!$runtime) { throw "Could not locate the $arch vcruntime140.dll redistributable." }
            $destination = Join-Path $output "NativeRuntime/win-$arch"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item $runtime.FullName (Join-Path $destination 'vcruntime140.dll') -Force
          }
      - name: Verify x64 Tegra swizzle dependencies load
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class SwizzleLoadProbe {
              [DllImport("kernel32.dll", EntryPoint = "LoadLibraryW", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern IntPtr LoadLibrary(string path);
          }
          "@
          $output = Join-Path $PWD 'Toolbox/bin/Release'
          $runtime = Join-Path $output 'NativeRuntime/win-x64/vcruntime140.dll'
          $swizzle = Join-Path $output 'tegra_swizzle_x64.dll'
          foreach ($path in @($runtime, $swizzle)) {
            $handle = [SwizzleLoadProbe]::LoadLibrary($path)
            if ($handle -eq [IntPtr]::Zero) { throw "Native DLL failed to load: $path (Win32 $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))" }
          }
      - name: Package build output
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'Toolbox/bin/Release'
          if (!(Test-Path (Join-Path $output 'Toolbox.exe'))) { throw "Release output did not contain Toolbox.exe at $output" }
          $stage = Join-Path $PWD 'build-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $output '*') -Destination $stage -Recurse -Force
          Copy-Item README.md, LICENSE, logo-new.png -Destination $stage -Force
          Get-ChildItem -Path $stage -Filter '*.zip' -File -Recurse | Remove-Item -Force
          if (!(Test-Path (Join-Path $stage 'Toolbox.exe'))) { throw 'Toolbox.exe must be at the ZIP root.' }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'SwitchToolbox2-build.zip' -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'SwitchToolbox2-build.zip'))
          try {
            if (!$archive.Entries.FullName.Contains('Toolbox.exe')) { throw 'The ZIP does not contain Toolbox.exe at its root.' }
            if ($archive.Entries | Where-Object { $_.FullName -match '(^|/)SwitchToolbox2-[^/]+\.zip$' }) { throw 'Nested ZIP packages are not allowed.' }
          } finally { $archive.Dispose() }
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SwitchToolbox2-${{ github.sha }}
          path: SwitchToolbox2-build.zip
          if-no-files-found: error
          retention-days: 14
