name: Manual Windows Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version used in the tag and ZIP filename, for example 1.0.0
        type: string
        required: true
      changelog:
        description: Release notes displayed on GitHub
        type: string
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore Toolbox.sln

      - name: Build Release
        run: msbuild Toolbox.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Package application
        shell: pwsh
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ($env:VERSION_NAME -match '[\\/:*?"<>|]') { throw "Version name contains characters that cannot be used in the release filename or tag." }
          $output = Join-Path $PWD 'Toolbox/bin/Release'
          if (!(Test-Path (Join-Path $output 'Toolbox.exe'))) { throw "Release output did not contain Toolbox.exe at $output" }
          $stage = Join-Path $PWD 'release-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $output '*') -Destination $stage -Recurse -Force
          Copy-Item README.md, LICENSE, logo-new.png -Destination $stage -Force
          $zip = "SwitchToolbox2-$($env:VERSION_NAME).zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$($env:VERSION_NAME)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Switch Toolbox 2 ${{ inputs.version_name }}
          body: ${{ inputs.changelog }}
          files: ${{ env.ZIP_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: false
