name: Feature request
description: Suggest a feature or format support improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please explain the user need, not just the proposed implementation. Do not attach copyrighted game files, keys, or private content.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I am trying to…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing workflow
    validations:
      required: false
  - type: input
    id: format
    attributes:
      label: Relevant file format or platform (if applicable)
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not include private or copyrighted data.
          required: true
